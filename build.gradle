plugins {
	id 'java'
}

group = 'com.nowwhat'
version = '1.0'

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.nowwhat.NowWhatPluginTest'

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
	}
	mavenCentral()
}

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
	annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'

	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'junit', name: 'junit', version: '4.13.2'
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}

// Belt and braces. The sources are pure ASCII (see asciiCheck), so this only
// matters for a source file that has not been checked in yet.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

test {
	useJUnit()
}

// The plugin hub builds submissions in 'standard' mode, which replaces this
// file - and with it the encoding setting above - with its own. Whether that
// javac runs with a UTF-8 default charset is not something this repository can
// see, and a raw em dash compiled under the wrong charset reaches the panel as
// mojibake. A \\uXXXX escape is decoded by javac before the parser runs, so it
// means the same character under every encoding. The sources are therefore kept
// ASCII-only, and this is what keeps them that way.
tasks.register('asciiCheck') {
	group = 'verification'
	description = 'Fails if a Java source contains a non-ASCII character.'

	def sources = fileTree('src') {
		include '**/*.java'
	}
	inputs.files sources

	doLast {
		def offenders = []
		sources.each { file ->
			file.eachLine('UTF-8') { line, number ->
				if (line.toCharArray().any { (int) it > 127 }) {
					offenders << "${file.path}:${number}"
				}
			}
		}
		if (!offenders.isEmpty()) {
			throw new GradleException(
				'Non-ASCII characters in Java sources. The plugin hub\'s standard build may\n' +
				'compile these under a non-UTF-8 charset and turn them into mojibake. Use a\n' +
				'\\uXXXX escape in a string literal, and plain ASCII punctuation in a comment:\n  ' +
				offenders.join('\n  '))
		}
	}
}

tasks.named('check') {
	dependsOn 'asciiCheck'
}

// The client's own copy of the compiled plugin, one jar per launch.
//
// A client run straight from build/classes loads each class the first time it
// is needed, so recompiling while one is open hands it new classes beside old
// ones it already holds. That surfaced as NoSuchFieldError on PathStep.Type in
// the middle of drawing a plan: the plan logic was fine, the client was running
// two builds at once. A jar named for this launch is never written again, and a
// jar still held open by a running client cannot be deleted on Windows, so the
// clean-up below only removes the ones no client is using.
def runJarName = "now-what-run-${System.currentTimeMillis()}.jar"
tasks.register('runJar', Jar) {
	from sourceSets.main.output
	from sourceSets.test.output
	destinationDirectory = layout.buildDirectory.dir('run')
	archiveFileName = runJarName
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	doFirst {
		fileTree(destinationDirectory).each { old -> old.delete() }
	}
}

// RuneLite dev mode: launches a real client with this plugin side-loaded.
tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Runs a RuneLite client with the Now What plugin side-loaded.'
	dependsOn 'runJar'
	def compiled = sourceSets.main.output.files + sourceSets.test.output.files
	classpath = files(tasks.named('runJar').flatMap { it.archiveFile }) +
		sourceSets.test.runtimeClasspath.filter { !compiled.contains(it) }
	mainClass = pluginMainClass
	// RuneLite refuses to side-load a builtin plugin without assertions on.
	jvmArgs '-ea'
	// Developer mode: enables the Developer Tools plugin (widget/varb inspectors),
	// which is the whole point of launching a client from source.
	args '--developer-mode'
}

tasks.register('plandiag', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.PlanDiag'
}

tasks.register('panelshot', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.PanelShot'
}

tasks.register('paneltext', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.PanelText'
}

tasks.register('iconcoverage', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.IconCoverage'
}

// Reads an item id out of RuneLite's ItemID constants, which is where every
// gameItemId in item-sources.json is supposed to come from rather than memory.
// Regenerates src/main/resources/com/nowwhat/item-names.txt, the item table the
// plugin ships in place of reading ItemID by reflection. Run it after changing
// gear or supply text; ItemNamesTableTest fails until you do.
tasks.register('itemnames', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.data.ItemNamesTable'
}

tasks.register('itemid', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.ItemIdLookup'
}

// Every quest name RuneLite tracks, for tools/audit_quests.py.
tasks.register('questnames', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.QuestNames'
}

tasks.register('suggestdiag', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.SuggestDiag'
}

// Which slots each gear setup leaves empty. Needs a saved copy of RuneLite's
// item stats: ./gradlew loadoutaudit -Pstats=path/to/stats.ids.min.json [-Pactivity=part_of_id]
tasks.register('loadoutaudit', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.nowwhat.diag.LoadoutAudit'
	args = [project.findProperty('stats') ?: '', project.findProperty('activity') ?: ''].findAll { it }
}
